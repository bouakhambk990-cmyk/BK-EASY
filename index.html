<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ບັນຊີຮ້ານ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  :root{
    --bg:#EDE6D6;
    --surface:#FFFDF8;
    --surface-2:#F6F0E2;
    --ink:#20302A;
    --ink-soft:#5C6B62;
    --accent:#C97A2B;
    --accent-dark:#A85F1B;
    --danger:#B23A2E;
    --danger-bg:#F6E4E1;
    --success:#3B7A57;
    --success-bg:#E4EEE8;
    --border:#DCD2B8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Noto Sans Lao","Phetsarath OT",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:76px;
    -webkit-tap-highlight-color:transparent;
  }
  header.top{
    background:var(--ink); color:var(--surface); padding:18px 16px 14px;
    position:sticky; top:0; z-index:20;
  }
  header.top h1{margin:0; font-size:20px; font-weight:700; letter-spacing:.2px;}
  header.top .sub{font-size:12.5px; color:#B9C4BC; margin-top:2px;}
  main{padding:14px 12px 8px; max-width:520px; margin:0 auto;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  .card h2{margin:0 0 10px; font-size:15.5px; font-weight:700; color:var(--ink);}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  label{display:block; font-size:12.5px; color:var(--ink-soft); margin:8px 0 4px;}
  input[type=text], input[type=number], input[type=date], input[type=tel], select, textarea{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:15px; background:var(--surface-2); color:var(--ink); font-family:inherit;
  }
  input[type=checkbox]{width:16px; height:16px; vertical-align:middle;}
  .chk-line{display:flex; align-items:center; gap:8px; margin:10px 0 2px; font-size:14px;}
  button{
    font-family:inherit; border:none; border-radius:8px; padding:10px 14px;
    font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .btn-main{background:var(--accent); color:#fff; width:100%; margin-top:12px;}
  .btn-main:active{background:var(--accent-dark);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-small{padding:6px 10px; font-size:12.5px;}
  .list-item{
    display:flex; gap:10px; align-items:center; padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .thumb{
    width:46px; height:46px; border-radius:8px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    flex-shrink:0; border:1px solid var(--border); font-size:18px; color:var(--ink-soft);
  }
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .item-main{flex:1; min-width:0;}
  .item-main .name{font-weight:600; font-size:14.5px;}
  .item-main .meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .tag{
    display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px;
    background:var(--surface-2); color:var(--ink-soft); margin-right:4px; border:1px solid var(--border);
  }
  .tag.warn{background:var(--danger-bg); color:var(--danger); border-color:transparent;}
  .stock-num{font-weight:700; font-size:15px; text-align:right; min-width:44px;}
  .low{color:var(--danger);}
  .empty{text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:14px;}
  .fab{
    position:fixed; right:16px; bottom:84px; width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:28px; display:flex; align-items:center;
    justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.25); z-index:15; border:none;
  }
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--border); display:flex; z-index:20;
  }
  nav.tabs button{
    flex:1; background:none; border-radius:0; padding:10px 4px 8px; color:var(--ink-soft);
    font-size:12px; display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  nav.tabs button .dot{width:6px; height:6px; border-radius:50%; background:transparent;}
  nav.tabs button.active{color:var(--accent); font-weight:700;}
  nav.tabs button.active .dot{background:var(--accent);}
  .modal-bg{
    position:fixed; inset:0; background:rgba(20,30,26,.5); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--bg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:16px 16px 0 0; padding:16px 16px 24px;
  }
  .modal h2{margin:2px 0 12px; font-size:17px;}
  .close-x{float:right; background:var(--surface-2); border:none; border-radius:50%;
    width:30px; height:30px; font-size:16px; color:var(--ink-soft);}
  .summary-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px;}
  .stat .label{font-size:12px; color:var(--ink-soft);}
  .stat .value{font-size:19px; font-weight:700; margin-top:4px;}
  .stat.income .value{color:var(--success);}
  .stat.expense .value{color:var(--danger);}
  .period-switch{display:flex; gap:6px; margin-bottom:12px;}
  .period-switch button{flex:1; background:var(--surface); border:1px solid var(--border); color:var(--ink-soft); font-size:12.5px;}
  .period-switch button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .txn-row{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid var(--border);}
  .txn-row:last-child{border-bottom:none;}
  .in-amt{color:var(--success); font-weight:600;}
  .out-amt{color:var(--danger); font-weight:600;}
  .search-bar{margin-bottom:10px;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:6px;}
  .reminder-box{background:var(--danger-bg); border:1px solid #E3B9B1; border-radius:10px; padding:10px 12px; margin-bottom:12px;}
  .reminder-box .r-title{font-weight:700; color:var(--danger); font-size:13.5px; margin-bottom:4px;}
  .reminder-line{font-size:12.5px; color:#7a3128; padding:2px 0;}
  .btn-scan{
    width:100%; margin-top:8px; background:var(--surface-2); color:var(--accent-dark);
    border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #scannerView{position:relative; width:100%; aspect-ratio:4/3; background:#111; border-radius:10px; overflow:hidden;}
  #scannerView video, #scannerView canvas{ position:absolute; top:0; left:0; width:100% !important; height:100% !important; object-fit:cover; }
  .scan-frame{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:78%; height:36%; border:2.5px solid var(--accent); border-radius:8px; pointer-events:none; z-index:5;
  }
  .barcode-row{display:flex; gap:8px; align-items:flex-end;}
  .barcode-row > div:first-child{flex:1;}
</style>
</head>
<body>

<header class="top">
  <h1>ບັນຊີຮ້ານ</h1>
  <div class="sub" id="headerDate"></div>
</header>

<main id="main"></main>

<button class="fab" id="fabBtn">+</button>

<nav class="tabs">
  <button data-tab="sale" class="active"><span>ຂາຍ</span><span class="dot"></span></button>
  <button data-tab="products"><span>ສີນຄ້າ</span><span class="dot"></span></button>
  <button data-tab="debts"><span>ໜີ້ສິນ</span><span class="dot"></span></button>
  <button data-tab="summary"><span>ສະຫລຸບ</span><span class="dot"></span></button>
</nav>

<div id="modalRoot"></div>

<script>
const S = window.storage;
let state = { products: [], transactions: [], debts: [] };
let cart = [];
let currentTab = 'sale';
let period = 'today';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Number(n||0).toLocaleString('en-US'); }

async function loadAll(){
  try{ const r = await S.get('products'); state.products = r ? JSON.parse(r.value) : []; }catch(e){ state.products = []; }
  try{ const r = await S.get('transactions'); state.transactions = r ? JSON.parse(r.value) : []; }catch(e){ state.transactions = []; }
  try{ const r = await S.get('debts'); state.debts = r ? JSON.parse(r.value) : []; }catch(e){ state.debts = []; }
}
async function saveProducts(){ try{ await S.set('products', JSON.stringify(state.products)); }catch(e){ console.error(e); } }
async function saveTxns(){ try{ await S.set('transactions', JSON.stringify(state.transactions)); }catch(e){ console.error(e); } }
async function saveDebts(){ try{ await S.set('debts', JSON.stringify(state.debts)); }catch(e){ console.error(e); } }

function setHeaderDate(){
  const d = new Date();
  document.getElementById('headerDate').textContent = 'ວັນທີ ' + d.toLocaleDateString('lo-LA', {year:'numeric', month:'long', day:'numeric'});
}

// ---------- MODAL HELPERS ----------
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`;
  document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeModal(); });
}
function closeModal(){ stopQuagga(); document.getElementById('modalRoot').innerHTML = ''; }

// ---------- BARCODE SCANNER ----------
function stopQuagga(){
  try{
    if(typeof Quagga !== 'undefined' && window.__quaggaRunning){
      Quagga.offDetected(handleDetected);
      Quagga.stop();
    }
  }catch(e){ /* ignore */ }
  window.__quaggaRunning = false;
}

function openScanner(onDetect){
  window.__onScanDetect = onDetect;
  window.__continuousMode = false;
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">
    <button class="close-x" onclick="closeScanner()">✕</button>
    <h2>ສະແກນບາໂຄດ</h2>
    <div id="scannerView"><div class="scan-frame"></div></div>
    <div class="hint" id="scanStatus">ກຳລັງເປີດກ້ອງ...</div>
    <label style="margin-top:14px">ຫຼື ພິມໂຄດເອງ</label>
    <div class="row">
      <input type="text" id="manualCode" placeholder="ພິມໂຄດສີນຄ້າ">
      <button class="btn-ghost" style="flex:0 0 auto" onclick="submitManualCode()">ຕົກລົງ</button>
    </div>
  </div></div>`;
  document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeScanner(); });
  startQuagga();
}

function closeScanner(){ stopQuagga(); closeModal(); }

function startQuagga(){
  if(typeof Quagga === 'undefined'){
    const s = document.getElementById('scanStatus');
    if(s) s.textContent = 'ບໍ່ສາມາດໂຫລດລະບົບສະແກນໄດ້ (ບໍ່ມີອິນເຕີເນັດ), ກະລຸນາພິມໂຄດເອງ';
    return;
  }
  Quagga.init({
    inputStream: {
      name: "Live", type: "LiveStream", target: document.getElementById('scannerView'),
      constraints: { facingMode: "environment", width: {ideal:640}, height:{ideal:480} }
    },
    locator: { patchSize: "medium", halfSample: true },
    numOfWorkers: 2,
    decoder: { readers: ["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","codabar_reader","code_39_reader"] },
    locate: true
  }, function(err){
    const s = document.getElementById('scanStatus');
    if(err){
      console.error(err);
      if(s) s.textContent = 'ບໍ່ສາມາດເປີດກ້ອງໄດ້, ກະລຸນາອະນຸຍາດການໃຊ້ກ້ອງ ຫຼື ພິມໂຄດເອງ';
      return;
    }
    Quagga.start();
    window.__quaggaRunning = true;
    if(s) s.textContent = 'ວາງບາໂຄດໃຫ້ຢູ່ໃນກອບ';
  });
  Quagga.onDetected(handleDetected);
}

let __lastScan = {code:null, time:0};
function handleDetected(result){
  const code = result?.codeResult?.code;
  if(!code) return;
  const now = Date.now();
  if(code === __lastScan.code && now - __lastScan.time < 1200) return;
  __lastScan = {code, time: now};
  const cb = window.__onScanDetect;
  if(window.__continuousMode){
    if(cb) cb(code);
    return;
  }
  stopQuagga();
  closeModal();
  if(cb) cb(code);
}

function submitManualCode(){
  const v = document.getElementById('manualCode').value.trim();
  if(!v) return;
  const cb = window.__onScanDetect;
  stopQuagga();
  closeModal();
  if(cb) cb(v);
}

function handleProductScan(code){
  const p = state.products.find(x=>x.barcode === code);
  if(p){ openProductDetail(p.id); }
  else if(confirm('ບໍ່ພົບສີນຄ້າໂຄດ ' + code + ' ໃນລະບົບ. ຕ້ອງການເພີ່ມສີນຄ້າໃໝ່ບໍ?')){
    openProductForm({barcode: code});
  }
}

// ---------- SALE / POS ----------
function cartTotal(){ return cart.reduce((s,c)=>s+c.price*c.qty,0); }
function cartCount(){ return cart.reduce((s,c)=>s+c.qty,0); }

function addProductToCart(p){
  if(p.stock<=0 && !confirm(esc(p.name)+' ໝົດສະຕັອກແລ້ວ, ຕ້ອງການຂາຍຕໍ່ບໍ?')){
    return {ok:false, msg:'ຍົກເລີກ (ໝົດສະຕັອກ)'};
  }
  const existing = cart.find(c=>c.productId===p.id);
  if(existing) existing.qty += 1;
  else cart.push({productId:p.id, name:p.name, price:p.sellPrice, qty:1, returnable:p.returnable});
  return {ok:true, msg: p.name + ' x1 ເພີ່ມແລ້ວ'};
}

function addToCartByCode(code){
  const p = state.products.find(x=>x.barcode === code);
  if(!p) return {ok:false, msg:'ບໍ່ພົບສີນຄ້າໂຄດ ' + code};
  return addProductToCart(p);
}

function renderSale(){
  const total = cartTotal();
  const rows = cart.length ? cart.map(c=>`
    <div class="list-item">
      <div class="item-main">
        <div class="name">${esc(c.name)}</div>
        <div class="meta">${fmt(c.price)} ກີບ / ໜ່ວຍ</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn-ghost btn-small" onclick="cartQty('${c.productId}',-1)">−</button>
        <span style="min-width:18px;text-align:center;font-weight:600">${c.qty}</span>
        <button class="btn-ghost btn-small" onclick="cartQty('${c.productId}',1)">+</button>
      </div>
      <div class="stock-num" style="margin-left:6px">${fmt(c.price*c.qty)}</div>
      <button class="btn-ghost btn-small" style="color:var(--danger);border-color:transparent" onclick="cartRemove('${c.productId}')">✕</button>
    </div>
  `).join('') : `<div class="empty">ຍັງບໍ່ມີສີນຄ້າ. ສະແກນ ຫຼື ພິມໂຄດຂ້າງເທິງ</div>`;

  document.getElementById('main').innerHTML = `
    <div class="card">
      <h2>ເພີ່ມສີນຄ້າ</h2>
      <div class="row">
        <input type="text" id="saleManualCode" placeholder="ພິມ ຫຼື ສະແກນໂຄດ ແລ້ວກົດ Enter">
        <button class="btn-ghost" style="flex:0 0 auto" onclick="submitSaleManual()">ເພີ່ມ</button>
      </div>
      <button class="btn-scan" onclick="openContinuousScanner()">ເປີດກ້ອງສະແກນຕໍ່ເນື່ອງ</button>
    </div>
    <div class="card">
      <h2>ລາຍການຂາຍ (${cartCount()} ໜ່ວຍ)</h2>
      ${rows}
    </div>
    <div class="card" style="position:sticky; bottom:70px; box-shadow:0 -4px 14px rgba(0,0,0,.08)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;color:var(--ink-soft)">ລວມທັງໝົດ</span>
        <span style="font-size:24px;font-weight:700">${fmt(total)} ກີບ</span>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn-ghost" onclick="clearCart()">ລ້າງລາຍການ</button>
        <button class="btn-main" style="margin-top:0" ${cart.length?'':'disabled'} onclick="openCheckout()">ຊຳລະ</button>
      </div>
    </div>
  `;
  const input = document.getElementById('saleManualCode');
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submitSaleManual(); } });
}

function submitSaleManual(){
  const el = document.getElementById('saleManualCode');
  const v = el.value.trim();
  if(!v) return;
  const r = addToCartByCode(v);
  el.value = '';
  if(!r.ok && r.msg.indexOf('ບໍ່ພົບ')===0){
    if(confirm(r.msg + '. ຕ້ອງການເພີ່ມສີນຄ້າໃໝ່ດ້ວຍໂຄດນີ້ບໍ?')){ openProductForm({barcode:v}); return; }
  }
  renderSale();
  document.getElementById('saleManualCode')?.focus();
}

function cartQty(productId, delta){
  const c = cart.find(x=>x.productId===productId);
  if(!c) return;
  c.qty += delta;
  if(c.qty<=0) cart = cart.filter(x=>x.productId!==productId);
  renderSale();
}
function cartRemove(productId){ cart = cart.filter(x=>x.productId!==productId); renderSale(); }
function clearCart(){
  if(cart.length && !confirm('ລ້າງລາຍການຂາຍທັງໝົດບໍ?')) return;
  cart = [];
  renderSale();
}

function openContinuousScanner(){
  window.__onScanDetect = continuousDetect;
  window.__continuousMode = true;
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">
    <button class="close-x" onclick="closeContinuousScanner()">✕</button>
    <h2>ສະແກນຂາຍ</h2>
    <div id="scannerView"><div class="scan-frame"></div></div>
    <div class="hint" id="scanStatus">ກຳລັງເປີດກ້ອງ...</div>
    <div id="scanFeedback" style="margin-top:8px;font-size:14px;font-weight:600;min-height:20px"></div>
    <div class="card" style="margin-top:6px;padding:10px">
      <div style="display:flex;justify-content:space-between;font-size:14px">
        <span id="scanCountLabel">ລວມ (${cartCount()} ໜ່ວຍ)</span>
        <span id="scanRunningTotal" style="font-weight:700">${fmt(cartTotal())} ກີບ</span>
      </div>
    </div>
    <label style="margin-top:12px">ຫຼື ພິມໂຄດເອງ</label>
    <div class="row">
      <input type="text" id="scanManualCode2" placeholder="ພິມໂຄດ">
      <button class="btn-ghost" style="flex:0 0 auto" onclick="continuousManualAdd()">ເພີ່ມ</button>
    </div>
    <button class="btn-main" onclick="closeContinuousScanner()">ສຳເລັດການສະແກນ / ກັບໄປລາຍການ</button>
  </div></div>`;
  document.getElementById('modalBg').addEventListener('click', (e)=>{ if(e.target.id==='modalBg') closeContinuousScanner(); });
  document.getElementById('scanManualCode2').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); continuousManualAdd(); } });
  startQuagga();
}

function continuousDetect(code){
  const r = addToCartByCode(code);
  updateScanFeedback(r);
}

function continuousManualAdd(){
  const el = document.getElementById('scanManualCode2');
  const v = el.value.trim();
  if(!v) return;
  const r = addToCartByCode(v);
  updateScanFeedback(r);
  el.value = '';
  el.focus();
}

function updateScanFeedback(r){
  const fb = document.getElementById('scanFeedback');
  if(fb){ fb.textContent = (r.ok?'✓ ':'⚠ ') + r.msg; fb.style.color = r.ok ? 'var(--success)' : 'var(--danger)'; }
  const cl = document.getElementById('scanCountLabel');
  if(cl) cl.textContent = 'ລວມ (' + cartCount() + ' ໜ່ວຍ)';

async function finalizeSale(method){
  if(!cart.length) return;
  let debtName='', debtPhone='', debtDue='';
  if(method==='credit'){
    debtName = document.getElementById('c_name')?.value.trim();
    if(!debtName){ alert('ກະລຸນາປ້ອນຊື່ລູກຄ້າ'); return; }
    debtPhone = document.getElementById('c_phone')?.value.trim() || '';
    debtDue = document.getElementById('c_due')?.value || '';
  }
  const date = todayStr();
  const productSummary = [];
  for(const item of cart){
    const idx = state.products.findIndex(p=>p.id===item.productId);
    if(idx>=0){
      const p = state.products[idx];
      p.stock -= item.qty;
      if(p.returnable) p.pendingReturn = (p.pendingReturn||0) + item.qty;
    }
    state.transactions.push({id:uid(), productId:item.productId, type:'out', qty:item.qty, price:item.price, total:item.price*item.qty, date});
    productSummary.push(item.name + ' x' + item.qty);
  }
  const total = cartTotal();
  if(method==='credit'){
    state.debts.push({id:uid(), customerName:debtName, phone:debtPhone, product:productSummary.join(', '), amount:total, date, dueDate:debtDue, paid:false, paidDate:null});
    await saveDebts();
  }
  await saveProducts();
  await saveTxns();
  cart = [];
  closeModal();
  renderSale();
  alert(method==='cash' ? ('ຮັບເງີນສົດສຳເລັດ ' + fmt(total) + ' ກີບ') : 'ບັນທຶກຂາຍເຊື່ອສຳເລັດແລ້ວ');
}

async function commitTxn(productId, type){
  const qty = Number(document.getElementById('t_qty').value)||0;
  if(qty<=0){ alert('ກະລຸນາປ້ອນຈຳນວນ'); return; }
  const date = document.getElementById('t_date').value || todayStr();
  const priceEl = document.getElementById('t_price');
  const price = priceEl ? Number(priceEl.value)||0 : 0;
  const idx = state.products.findIndex(p=>p.id===productId);
  const p = state.products[idx];
  if(type==='in'){
    p.stock += qty;
  } else if(type==='out'){
    if(qty > p.stock){ if(!confirm('ຈຳນວນຂາຍຫຼາຍກວ່າສະຕັອກ, ຈະສືບຕໍ່ບໍ?')) return; }
    p.stock -= qty;
    if(p.returnable) p.pendingReturn = (p.pendingReturn||0) + qty;
  } else if(type==='return'){
    p.pendingReturn = Math.max(0,(p.pendingReturn||0) - qty);
  }
  state.transactions.push({id:uid(), productId, type, qty, price, total: price*qty, date});
  await saveProducts();
  await saveTxns();
  closeModal();
  if(currentTab==='products') renderProducts();
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

function renderDebts(){
  const unpaid = state.debts.filter(d=>!d.paid);
  const dueSoon = unpaid.filter(d=>{ const du = daysUntil(d.dueDate); return du!==null && du<=3; })
    .sort((a,b)=> daysUntil(a.dueDate)-daysUntil(b.dueDate));

  let reminderHtml = '';
  if(dueSoon.length){
    reminderHtml = `<div class="reminder-box"><div class="r-title">ໃກ້ຄົບກຳນົດ / ຄ້າງຈ່າຍ</div>
      ${dueSoon.map(d=>{
        const du = daysUntil(d.dueDate);
        const label = du<0 ? `ເກີນກຳນົດ ${-du} ວັນ` : du===0 ? 'ຄົບກຳນົດມື້ນີ້' : `ອີກ ${du} ວັນ`;
        return `<div class="reminder-line">${esc(d.customerName)} - ${fmt(d.amount)} ກີບ (${label})</div>`;
      }).join('')}
    </div>`;
  }

  const list = [...state.debts].sort((a,b)=> (a.paid - b.paid) || new Date(b.date)-new Date(a.date));
  let itemsHtml = list.length ? list.map(d=>{
    const du = daysUntil(d.dueDate);
    const overdue = !d.paid && du!==null && du<0;
    return `<div class="list-item" data-id="${d.id}" onclick="openDebtDetail('${d.id}')">
      <div class="item-main">
        <div class="name">${esc(d.customerName)} ${d.phone?`· ${esc(d.phone)}`:''}</div>

          ${d.paid ? `<span class="tag" style="background:var(--success-bg);color:var(--success);border-color:transparent">ຈ່າຍແລ້ວ</span>`
            : overdue ? `<span class="tag warn">ເກີນກຳນົດ</span>` : `<span class="tag">ຄ້າງ</span>`}
        </div>
      </div>
      <div class="stock-num ${!d.paid?'low':''}">${fmt(d.amount)}</div>
    </div>`;
  }).join('') : `<div class="empty">ຍັງບໍ່ມີລາຍການໜີ້. ກົດ + ເພື່ອເພີ່ມ</div>`;

  document.getElementById('main').innerHTML = `
    ${reminderHtml}
    <div class="card"><h2>ລາຍການໜີ້ລູກຄ້າ</h2>${itemsHtml}</div>
  `;
}

    phone: document.getElementById('d_phone').value.trim(),
    product: document.getElementById('d_product').value.trim(),
    amount: Number(document.getElementById('d_amount').value)||0,
    date: document.getElementById('d_date').value || todayStr(),
    dueDate: document.getElementById('d_due').value || '',
  };
  if(id){
    const idx = state.debts.findIndex(x=>x.id===id);
    state.debts[idx] = {...state.debts[idx], ...data};
  } else {
    state.debts.push({id:uid(), paid:false, paidDate:null, ...data});
  }
  await saveDebts();
  closeModal();
  renderDebts();
}

function openDebtDetail(id){
  const d = state.debts.find(x=>x.id===id);
  if(!d) return;
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h2>${esc(d.customerName)}</h2>
    <div class="hint">${d.phone?esc(d.phone)+' · ':''}${d.product?esc(d.product):''}</div>
    <div class="row" style="margin-top:10px">
      <div class="stat"><div class="label">ຈຳນວນເງີນ</div><div class="value">${fmt(d.amount)}</div></div>
      <div class="stat"><div class="label">ສະຖານະ</div><div class="value" style="font-size:14px;color:${d.paid?'var(--success)':'var(--danger)'}">${d.paid?'ຈ່າຍແລ້ວ':'ຍັງຄ້າງ'}</div></div>
    </div>
    <div class="hint" style="margin-top:8px">ວັນທີກູ້ຢືມ: ${d.date} ${d.dueDate?`· ກຳນົດຈ່າຍ: ${d.dueDate}`:''}</div>
    ${d.paid && d.paidDate ? `<div class="hint">ຈ່າຍແລ້ວເມື່ອ: ${d.paidDate}</div>`:''}
    <div class="row" style="margin-top:14px">
      ${!d.paid?`<button class="btn-main" style="background:var(--success)" onclick="markDebtPaid('${id}')">ໝາຍວ່າຈ່າຍແລ້ວ</button>`:
      `<button class="btn-ghost" onclick="markDebtUnpaid('${id}')">ຍົກເລີກການຈ່າຍ</button>`}
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn-ghost" onclick="openDebtFormById('${id}')">ແກ້ໄຂ</button>
      <button class="btn-danger" onclick="deleteDebt('${id}')">ລຶບ</button>
    </div>
  `);
}
function openDebtFormById(id){
  const d = state.debts.find(x=>x.id===id);
  if(d) openDebtForm(d);
}

async function markDebtPaid(id){
  const idx = state.debts.findIndex(x=>x.id===id);
  state.debts[idx].paid = true;
  state.debts[idx].paidDate = todayStr();
  await saveDebts();
  closeModal();
  renderDebts();
}
async function markDebtUnpaid(id){
  const idx = state.debts.findIndex(x=>x.id===id);
  state.debts[idx].paid = false;
  state.debts[idx].paidDate = null;
  await saveDebts();
  closeModal();
  renderDebts();
}
async function deleteDebt(id){
  if(!confirm('ລຶບລາຍການໜີ້ນີ້ບໍ?')) return;
  state.debts = state.debts.filter(d=>d.id!==id);
  await saveDebts();
  closeModal();
  renderDebts();
}

// ---------- SUMMARY TAB ----------
function inRange(dateStr, p){
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  if(p==='today') return dateStr===todayStr();
  if(p==='week'){ const start=new Date(now); start.setDate(now.getDate()-6); return d>=start && d<=now; }
  if(p==='month'){ return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }
  return true;
}

function renderSummary(){
  const txns = state.transactions.filter(t=>inRange(t.date, period));
  const income = txns.filter(t=>t.type==='out').reduce((s,t)=>s+(t.total||0),0);
  const expense = txns.filter(t=>t.type==='in').reduce((s,t)=>s+(t.total||0),0);
  const profit = income - expense;
  const unpaidTotal = state.debts.filter(d=>!d.paid).reduce((s,d)=>s+(d.amount||0),0);
  const recent = [...txns].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,15);

  const labels = {today:'ມື້ນີ້', week:'7 ວັນ', month:'ເດືອນນີ້', all:'ທັງໝົດ'};

  document.getElementById('main').innerHTML = `
    <div class="period-switch">
      ${Object.keys(labels).map(k=>`<button data-p="${k}" class="${period===k?'active':''}">${labels[k]}</button>`).join('')}
    </div>
    <div class="summary-grid">
      <div class="stat income"><div class="label">ລາຍຮັບ (ຂາຍ)</div><div class="value">${fmt(income)}</div></div>
      <div class="stat expense"><div class="label">ລາຍຈ່າຍ (ຊື້ເຂົ້າ)</div><div class="value">${fmt(expense)}</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>ກຳໄລສຸດທິ</h2>
      <div style="font-size:24px;font-weight:700;color:${profit>=0?'var(--success)':'var(--danger)'}">${fmt(profit)} ກີບ</div>
    </div>
    <div class="card">
      <h2>ໜີ້ຄ້າງທັງໝົດ</h2>
      <div style="font-size:20px;font-weight:700;color:var(--danger)">${fmt(unpaidTotal)} ກີບ</div>
    </div>
    <div class="card">
      <h2>ລາຍການລ້າສຸດ</h2>
      ${recent.length? recent.map(t=>{
        const p = state.products.find(x=>x.id===t.productId);
        return `<div class="txn-row"><span>${t.date} · ${esc(p?p.name:'-')} (${t.type==='in'?'ຮັບເຂົ້າ':t.type==='out'?'ຂາຍອອກ':'ປ່ຽນຄືນ'})</span><span class="${t.type==='out'?'in-amt':'out-amt'}">${fmt(t.total||0)}</span></div>`;
      }).join('') : `<div class="hint">ບໍ່ມີລາຍການໃນຊ່ວງນີ້</div>`}
    </div>
  `;
  document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click', ()=>{ period=b.getAttribute('data-p'); renderSummary(); }));
}

// ---------- TAB SWITCH & FAB ----------
function render(){
  const fab = document.getElementById('fabBtn');
  fab.style.display = currentTab==='summary' ? 'none' : 'flex';
  fab.textContent = currentTab==='sale' ? '📷' : '+';
  if(currentTab==='sale') renderSale();
  else if(currentTab==='products') renderProducts();
  else if(currentTab==='debts') renderDebts();
  else renderSummary();
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.getAttribute('data-tab');
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    window.__activeCat = '';
    render();
  });
});

document.getElementById('fabBtn').addEventListener('click', ()=>{
  if(currentTab==='sale') openContinuousScanner();
  else if(currentTab==='products') openProductForm(null);
  else if(currentTab==='debts') openDebtForm(null);
});

(async function init(){
  setHeaderDate();
  await loadAll();
  render();
})();
</script>
</body>
</html>
